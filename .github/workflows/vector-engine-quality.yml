name: Qoin vector engine quality

on:
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/rust-axum/Cargo.toml"
      - "backend/rust-axum/crates/qoin-vector-engine/**"
      - "backend/rust-axum/src/**"
      - "backend/rust-axum-api/**"
      - "frontend/packages/core/src/qoinApi.ts"
      - "shared/contracts/openapi.yaml"
      - ".github/workflows/vector-engine-quality.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/rust-axum/Cargo.toml"
      - "backend/rust-axum/crates/qoin-vector-engine/**"
      - "backend/rust-axum/src/**"
      - "backend/rust-axum-api/**"
      - "frontend/packages/core/src/qoinApi.ts"
      - "shared/contracts/openapi.yaml"
      - ".github/workflows/vector-engine-quality.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Rust workspace
        run: cargo fmt --manifest-path backend/rust-axum/crates/qoin-vector-engine/Cargo.toml
      - name: Commit canonical Rust formatting to master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- backend/rust-axum/crates/qoin-vector-engine; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/rust-axum/crates/qoin-vector-engine
          git commit -m "style: format qoin vector engine"
          git push origin HEAD:master
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path backend/rust-axum/crates/qoin-vector-engine/Cargo.toml -- --check
      - name: Test vector engine with all features
        run: cargo test --manifest-path backend/rust-axum/crates/qoin-vector-engine/Cargo.toml --all-features
      - name: Clippy vector engine with warnings denied
        run: cargo clippy --manifest-path backend/rust-axum/crates/qoin-vector-engine/Cargo.toml --all-features -- -D warnings
