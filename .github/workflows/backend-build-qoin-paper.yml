name: Build Qoin research PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/QOIN_ALGORITHM_OBSERVATIONS_MATH_PHILOSOPHY.md'
      - 'scripts/build_qoin_paper.py'
      - '.github/workflows/build-qoin-paper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/QOIN_ALGORITHM_OBSERVATIONS_MATH_PHILOSOPHY.md'
      - 'scripts/build_qoin_paper.py'
      - '.github/workflows/build-qoin-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qoin-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install reportlab
      - name: Render detailed paper
        run: python scripts/build_qoin_paper.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/QOIN_ALGORITHM_OBSERVATIONS_MATH_PHILOSOPHY.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current"
          else
            git commit -m "Add generated Qoin algorithm research PDF"
            git push origin HEAD:main
          fi
