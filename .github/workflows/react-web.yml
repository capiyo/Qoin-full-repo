name: Qoin React web

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @qoin/web build
