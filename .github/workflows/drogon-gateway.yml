name: Qoin Drogon gateway
on:
  push:
    branches: [main, feat/mongodb-edge-strategy-map]
    paths:
      - "services/drogon/**"
      - ".github/workflows/drogon-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/drogon/**"
      - ".github/workflows/drogon-gateway.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Drogon and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdrogon-dev libjsoncpp-dev uuid-dev
      - name: Configure gateway
        run: cmake -S services/drogon -B build/drogon -DCMAKE_BUILD_TYPE=Release
      - name: Build gateway
        run: cmake --build build/drogon --parallel 2
