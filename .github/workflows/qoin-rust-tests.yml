name: Qoin Rust workspace tests

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/rust-axum/**"
      - ".github/workflows/qoin-rust-tests.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/rust-axum/**"
      - ".github/workflows/qoin-rust-tests.yml"

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust workspace
        run: cargo test --workspace
