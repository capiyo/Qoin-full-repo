name: Qoin Axum-Drogon MongoDB integration
on:
  push:
    branches: [main, feat/mongodb-edge-strategy-map]
    paths:
      - "backend/rust-axum/**"
      - "backend/cpp-drogon/**"
      - "docker-compose.yml"
      - ".github/workflows/qoin-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/rust-axum/**"
      - "backend/cpp-drogon/**"
      - "docker-compose.yml"
      - ".github/workflows/qoin-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Drogon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdrogon-dev libjsoncpp-dev uuid-dev libmariadb-dev libbrotli-dev libhiredis-dev libyaml-cpp-dev
      - name: Build Axum
        run: cargo build --manifest-path backend/rust-axum/Cargo.toml
      - name: Build Drogon
        run: |
          cmake -S backend/cpp-drogon -B build/drogon -DCMAKE_BUILD_TYPE=Release
          cmake --build build/drogon --parallel 2
      - name: Verify gateway, MongoDB strategy persistence, and event flow
        shell: bash
        run: |
          set -euo pipefail
          export QOIN_MONGODB_URI=mongodb://127.0.0.1:27017
          export QOIN_MONGODB_DATABASE=qoin_ci
          export QOIN_AXUM_ADDR=127.0.0.1:8081
          export QOIN_AXUM_URL=http://127.0.0.1:8081
          export QOIN_DROGON_PORT=8080
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum.log 2>&1 &
          AXUM_PID=$!
          ./build/drogon/qoin-gateway >/tmp/qoin-drogon.log 2>&1 &
          DROGON_PID=$!
          cleanup() { kill "$DROGON_PID" "$AXUM_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          jq -e '.status == "ok" and .mongodb == true' /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy.json
          jq -e '.strategy_key == "active" and .version != ""' /tmp/strategy.json
          jq '.version = "edge-map-ci-smoke-v2"' /tmp/strategy.json >/tmp/strategy-updated.json
          curl -fsS -X PUT http://127.0.0.1:8080/api/v1/strategy -H 'content-type: application/json' --data-binary @/tmp/strategy-updated.json >/tmp/strategy-put.json
          jq -e '.status == "strategy_updated" and .strategy.version == "edge-map-ci-smoke-v2"' /tmp/strategy-put.json
          kill "$AXUM_PID"
          wait "$AXUM_PID" 2>/dev/null || true
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum-restarted.log 2>&1 &
          AXUM_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/health-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy-reloaded.json
          jq -e '.version == "edge-map-ci-smoke-v2"' /tmp/strategy-reloaded.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-book-1","venue":"ci","symbol":"BTCUSDT","event_type":"book","ts_ms":1792860000000,"bid":100,"ask":100.01,"bid_size":4,"ask_size":3}' >/tmp/book.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-trade-1","venue":"ci","symbol":"BTCUSDT","event_type":"trade","ts_ms":1792860000100,"price":100.01,"size":1,"side":"buy"}' >/tmp/trade.json
          jq -e '.status == "accepted" and .decision.strategy_version == "edge-map-ci-smoke-v2"' /tmp/trade.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-late-base","venue":"ci","symbol":"LATECHECK","event_type":"trade","ts_ms":1792860000100,"price":100,"size":1,"side":"buy"}' >/tmp/late-base.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-late-trade","venue":"ci","symbol":"LATECHECK","event_type":"trade","ts_ms":1792860000050,"price":99.99,"size":7,"side":"sell"}' >/tmp/late-event.json
          jq -e '.status == "stored_out_of_order_event_not_applied"' /tmp/late-event.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-other-venue","venue":"ci-other","symbol":"BTCUSDT","event_type":"trade","ts_ms":1792860000100,"price":150,"size":3,"side":"buy"}' >/tmp/other-venue.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/state?symbol=BTCUSDT&venue=ci' >/tmp/state-ci.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/state?symbol=BTCUSDT&venue=ci-other' >/tmp/state-other.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/state?symbol=LATECHECK&venue=ci' >/tmp/state-late.json
          jq -e '.venue == "ci" and .event_count == 2' /tmp/state-ci.json
          jq -e '.venue == "ci-other" and .event_count == 1' /tmp/state-other.json
          jq -e '.venue == "ci" and .event_count == 1' /tmp/state-late.json
          curl -fsS -X PUT http://127.0.0.1:8081/internal/operating-cycle -H 'content-type: application/json' --data '{"observation_minutes":5,"weight_evaluation_minutes":60,"session_minutes":480,"mode":"research","paper_accounts":[]}' >/tmp/cycle-config.json
          curl -fsS -X POST http://127.0.0.1:8081/internal/operating-cycle/start >/tmp/cycle-start.json
          STRATEGY_LOCK_STATUS=$(curl -sS -o /tmp/strategy-locked.json -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/v1/strategy -H 'content-type: application/json' --data-binary @/tmp/strategy-updated.json)
          test "$STRATEGY_LOCK_STATUS" = "409"
          jq -e '.error | contains("locked")' /tmp/strategy-locked.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-cycle-book","venue":"ci","symbol":"ETHUSDT","event_type":"book","ts_ms":1792860000200,"bid":200,"ask":200.02,"bid_size":5,"ask_size":4}' >/tmp/cycle-book.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data '{"event_id":"ci-cycle-trade","venue":"ci","symbol":"ETHUSDT","event_type":"trade","ts_ms":1792860000300,"price":200.01,"size":2,"side":"buy"}' >/tmp/cycle-trade.json
          curl -fsS http://127.0.0.1:8081/internal/operating-cycle >/tmp/cycle-active.json
          jq -e '.observations == 2 and .signal_evaluations == 2 and .live_execution_enabled == false' /tmp/cycle-active.json
          curl -fsS -X POST http://127.0.0.1:8081/internal/operating-cycle/stop >/tmp/cycle-stop.json
          curl -fsS -X POST http://127.0.0.1:8081/internal/backtest -H 'content-type: application/json' --data '{"symbol":"BTCUSDT","venue":"ci","quote_currency":"USD","start_ts_ms":1792859999000,"end_ts_ms":1792860000200,"warmup_hours":1,"initial_cash":20000,"notional_per_trade":2000,"reinvest_profits":true,"fee_bps":10,"slippage_bps":5,"max_events":1000}' >/tmp/backtest.json
          jq -e '.event_count == 2 and .signal_count == 2 and .venue == "ci" and .quote_currency == "USD" and .reinvest_profits == true and .pending_order == "buy" and (.decisions | length) == 2' /tmp/backtest.json
          RUN_ID=$(jq -r '.run_id' /tmp/backtest.json)
          curl -fsS "http://127.0.0.1:8081/internal/backtests/$RUN_ID" >/tmp/backtest-reloaded.json
          jq -e '.summary.venue == "ci" and (.decisions | length) == 3' /tmp/backtest-reloaded.json
          kill "$AXUM_PID"
          wait "$AXUM_PID" 2>/dev/null || true
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum-cycle-restarted.log 2>&1 &
          AXUM_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/health-cycle-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/internal/operating-cycle >/tmp/cycle-restored.json
          jq -e '.phase == "stopped" and .observations == 2 and .signal_evaluations == 2' /tmp/cycle-restored.json
          curl -fsS -X PUT http://127.0.0.1:8081/internal/operating-cycle -H 'content-type: application/json' --data '{"observation_minutes":5,"weight_evaluation_minutes":60,"session_minutes":480,"mode":"paper","paper_accounts":[{"symbol":"ETHUSDT","venue":"ci","quote_currency":"USD","initial_cash":20000,"notional_per_trade":2000,"reinvest_profits":true,"fee_bps":10,"slippage_bps":5}]}' >/tmp/paper-cycle-config.json
          curl -fsS -X POST http://127.0.0.1:8081/internal/operating-cycle/start >/tmp/paper-cycle-start.json
          curl -fsS http://127.0.0.1:8081/internal/paper-session >/tmp/paper-session-active.json
          jq -e '.active == true and .live_execution_enabled == false and .accounts[0].symbol == "ETHUSDT"' /tmp/paper-session-active.json
          curl -fsS 'http://127.0.0.1:8081/internal/paper-session/history?limit=10' >/tmp/paper-session-history.json
          jq -e '(.decisions | type) == "array" and (.trades | type) == "array"' /tmp/paper-session-history.json
          curl -fsS -X POST http://127.0.0.1:8081/internal/operating-cycle/stop >/tmp/paper-cycle-stop.json
          kill "$AXUM_PID"
          wait "$AXUM_PID" 2>/dev/null || true
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum-paper-restarted.log 2>&1 &
          AXUM_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/health-paper-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/internal/paper-session >/tmp/paper-session-restored.json
          jq -e '.active == false and .accounts[0].symbol == "ETHUSDT" and .live_execution_enabled == false' /tmp/paper-session-restored.json
