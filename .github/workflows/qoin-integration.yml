name: Qoin Axum-Drogon MongoDB integration
on:
  push:
    branches: [main, feat/mongodb-edge-strategy-map]
    paths:
      - "backend/rust-axum/**"
      - "backend/cpp-drogon/**"
      - "docker-compose.yml"
      - ".github/workflows/qoin-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/rust-axum/**"
      - "backend/cpp-drogon/**"
      - "docker-compose.yml"
      - ".github/workflows/qoin-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Drogon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdrogon-dev libjsoncpp-dev uuid-dev libmariadb-dev libbrotli-dev libhiredis-dev libyaml-cpp-dev
      - name: Build Axum
        run: cargo build --manifest-path backend/rust-axum/Cargo.toml
      - name: Build Drogon
        run: |
          cmake -S backend/cpp-drogon -B build/drogon -DCMAKE_BUILD_TYPE=Release
          cmake --build build/drogon --parallel 2
      - name: Verify gateway, MongoDB strategy persistence, and event flow
        shell: bash
        run: |
          set -euo pipefail
          set -x
          export QOIN_MONGODB_URI=mongodb://127.0.0.1:27017
          export QOIN_MONGODB_DATABASE=qoin_ci
          export QOIN_AXUM_ADDR=127.0.0.1:8081
          export QOIN_AXUM_URL=http://127.0.0.1:8081
          export QOIN_DROGON_PORT=8080
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum.log 2>&1 &
          AXUM_PID=$!
          ./build/drogon/qoin-gateway >/tmp/qoin-drogon.log 2>&1 &
          DROGON_PID=$!
          cleanup() {
            local exit_status=$?
            if [[ $exit_status -ne 0 ]]; then
              echo "---- Axum diagnostics ----"
              cat /tmp/qoin-axum.log /tmp/qoin-axum-restarted.log 2>/dev/null || true
              echo "---- Drogon diagnostics ----"
              cat /tmp/qoin-drogon.log 2>/dev/null || true
            fi
            kill "$DROGON_PID" "$AXUM_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          jq -e '.status == "ok" and .mongodb == true' /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy.json
          jq -e '.strategy_key == "active" and .version != ""' /tmp/strategy.json
          jq '.version = "edge-map-ci-smoke-v2"' /tmp/strategy.json >/tmp/strategy-updated.json
          curl -fsS -X PUT http://127.0.0.1:8080/api/v1/strategy -H 'content-type: application/json' --data-binary @/tmp/strategy-updated.json >/tmp/strategy-put.json
          jq -e '.status == "strategy_updated" and .strategy.version == "edge-map-ci-smoke-v2"' /tmp/strategy-put.json
          kill "$AXUM_PID"
          wait "$AXUM_PID" 2>/dev/null || true
          ./target/debug/qoin-flow-engine >/tmp/qoin-axum-restarted.log 2>&1 &
          AXUM_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/health-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy-reloaded.json
          jq -e '.version == "edge-map-ci-smoke-v2"' /tmp/strategy-reloaded.json
          NOW_MS=$(($(date +%s%3N) - 30000))
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data "{\"event_id\":\"ci-book-1\",\"venue\":\"ci\",\"symbol\":\"BTCUSDT\",\"asset_class\":\"crypto\",\"event_type\":\"book\",\"ts_ms\":$NOW_MS,\"bid\":100,\"ask\":100.01,\"bid_size\":4,\"ask_size\":3}" >/tmp/book-1.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data "{\"event_id\":\"ci-trade-1\",\"venue\":\"ci\",\"symbol\":\"BTCUSDT\",\"asset_class\":\"crypto\",\"event_type\":\"trade\",\"ts_ms\":$((NOW_MS + 10)),\"price\":100.01,\"size\":1,\"side\":\"buy\"}" >/tmp/trade-1.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data "{\"event_id\":\"ci-book-2\",\"venue\":\"ci\",\"symbol\":\"BTCUSDT\",\"asset_class\":\"crypto\",\"event_type\":\"book\",\"ts_ms\":$((NOW_MS + 20)),\"bid\":100.01,\"ask\":100.02,\"bid_size\":5,\"ask_size\":2}" >/tmp/book-2.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data "{\"event_id\":\"ci-trade-2\",\"venue\":\"ci\",\"symbol\":\"BTCUSDT\",\"asset_class\":\"crypto\",\"event_type\":\"trade\",\"ts_ms\":$((NOW_MS + 30)),\"price\":100.02,\"size\":2,\"side\":\"buy\"}" >/tmp/trade-2.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'content-type: application/json' --data "{\"event_id\":\"ci-trade-3\",\"venue\":\"ci\",\"symbol\":\"BTCUSDT\",\"asset_class\":\"crypto\",\"event_type\":\"trade\",\"ts_ms\":$((NOW_MS + 40)),\"price\":100.00,\"size\":0.5,\"side\":\"sell\"}" >/tmp/trade-3.json
          jq -e '.status == "accepted" and .decision.strategy_version == "edge-map-ci-smoke-v2"' /tmp/trade-3.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/instruments?asset_class=crypto' >/tmp/instruments.json
          jq -e '.symbols | index("BTCUSDT") != null' /tmp/instruments.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/market-horizons?symbol=BTCUSDT&asset_class=crypto&min_events=5' >/tmp/horizons.json
          jq -e '.mode == "research_only" and .asset_class == "crypto" and (.observations[] | select(.horizon == "one_minute") | .ready == true)' /tmp/horizons.json
          jq -e '(.observations[] | select(.horizon == "one_hour") | .ready == false) and (.observations[] | select(.horizon == "one_hour") | .coverage_ratio < 0.15)' /tmp/horizons.json
          MISSING_CLASS_STATUS=$(curl -sS -o /tmp/missing-asset-class.json -w '%{http_code}' 'http://127.0.0.1:8080/api/v1/market-horizons?symbol=BTCUSDT&min_events=5')
          test "$MISSING_CLASS_STATUS" = "400"
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/signal -H 'content-type: application/json' --data '{"observation":{"ofi":2.0,"liquidity":1.0,"volatility":0.2,"funding":-0.5,"open_interest_change":1.0,"liquidation_pressure":0.5,"basis":0.0},"has_open_position":false}' >/tmp/signal.json
          jq -e '.decision == "BUY" and .config_version == "qoin-vector-baseline-v1"' /tmp/signal.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/multi-horizon -H 'content-type: application/json' --data '[{"horizon":"five_minutes","observation":{"ofi":2.0,"liquidity":1.0,"volatility":0.2,"funding":-0.5,"open_interest_change":1.0,"liquidation_pressure":0.5,"basis":0.0},"config":{"signal_threshold":0.65,"input_clip":3.0,"score_clip":1.0,"top_k":5,"min_alignment":0.15,"max_angle_radians":1.42,"volatility_dampener":0.15,"interaction_coefficient":0.025},"config_version":"ci-v1","has_open_position":false},{"horizon":"one_day","observation":{"ofi":-2.0,"liquidity":-1.0,"volatility":0.2,"funding":0.5,"open_interest_change":-1.0,"liquidation_pressure":-0.5,"basis":0.0},"config":{"signal_threshold":0.65,"input_clip":3.0,"score_clip":1.0,"top_k":5,"min_alignment":0.15,"max_angle_radians":1.42,"volatility_dampener":0.15,"interaction_coefficient":0.025},"config_version":"ci-v1","has_open_position":false}]' >/tmp/multi-horizon.json
          jq -e '.consensus.relationship == "divergent" and .consensus.buy_count == 1 and .consensus.sell_count == 1' /tmp/multi-horizon.json
          curl -fsS 'http://127.0.0.1:8080/api/v1/state?symbol=BTCUSDT&asset_class=crypto' >/tmp/asset-state.json
          jq -e '.asset_class == "crypto"' /tmp/asset-state.json
