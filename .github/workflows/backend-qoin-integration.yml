name: Qoin Axum-Drogon MongoDB integration
on:
  push:
    branches: [main, backend, organized-monorepo, qoin-hardening, feat/mongodb-edge-strategy-map]
    paths:
      - "backend/axum/**"
      - "backend/drogon/**"
      - "backend/docker-compose.yml"
      - ".github/workflows/backend-qoin-integration.yml"
  pull_request:
    branches: [main, organized-monorepo]
    paths:
      - "backend/axum/**"
      - "backend/drogon/**"
      - "backend/docker-compose.yml"
      - ".github/workflows/backend-qoin-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Drogon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdrogon-dev libjsoncpp-dev uuid-dev libmariadb-dev libbrotli-dev libhiredis-dev libyaml-cpp-dev
      - name: Build Axum
        run: cargo build --manifest-path backend/Cargo.toml -p qoin-flow-engine
      - name: Build Drogon
        run: |
          cmake -S backend/drogon -B build/drogon -DCMAKE_BUILD_TYPE=Release
          cmake --build build/drogon --parallel 2
      - name: Verify gateway, MongoDB strategy persistence, and event flow
        shell: bash
        run: |
          set -euo pipefail
          export QOIN_MONGODB_URI=mongodb://127.0.0.1:27017
          export QOIN_MONGODB_DATABASE=qoin_ci
          export QOIN_AXUM_ADDR=127.0.0.1:8081
          export QOIN_AXUM_URL=http://127.0.0.1:8081
          export QOIN_DROGON_PORT=8080
          export QOIN_INGEST_TOKEN=ci-ingest-token-rotate-outside-ci
          export QOIN_ADMIN_TOKEN=ci-admin-token-rotate-outside-ci
          ./backend/target/debug/qoin-flow-engine >/tmp/qoin-axum.log 2>&1 &
          AXUM_PID=$!
          ./build/drogon/qoin-gateway >/tmp/qoin-drogon.log 2>&1 &
          DROGON_PID=$!
          cleanup() { kill "$DROGON_PID" "$AXUM_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          jq -e '.status == "ok" and .mongodb == true' /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy.json
          jq -e '.strategy_key == "active" and .version != ""' /tmp/strategy.json
          jq '.version = "edge-map-ci-smoke-v2"' /tmp/strategy.json >/tmp/strategy-updated.json
          curl -fsS -X PUT http://127.0.0.1:8080/api/v1/strategy -H 'authorization: Bearer ci-admin-token-rotate-outside-ci' -H 'content-type: application/json' --data-binary @/tmp/strategy-updated.json >/tmp/strategy-put.json
          jq -e '.status == "strategy_updated" and .strategy.version == "edge-map-ci-smoke-v2"' /tmp/strategy-put.json
          kill "$AXUM_PID"
          wait "$AXUM_PID" 2>/dev/null || true
          ./backend/target/debug/qoin-flow-engine >/tmp/qoin-axum-restarted.log 2>&1 &
          AXUM_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/health-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/strategy >/tmp/strategy-reloaded.json
          jq -e '.version == "edge-map-ci-smoke-v2"' /tmp/strategy-reloaded.json
          BOOK_TS=$(date +%s%3N)
          TRADE_TS=$((BOOK_TS + 100))
          OLD_TS=$((BOOK_TS + 50))
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'authorization: Bearer ci-ingest-token-rotate-outside-ci' -H 'content-type: application/json' --data '{"event_id":"ci-book-1","venue":"ci","symbol":"BTCUSDT","event_type":"book","ts_ms":${BOOK_TS},"sequence":1,"bid":100,"ask":100.01,"bid_size":4,"ask_size":3}' >/tmp/book.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'authorization: Bearer ci-ingest-token-rotate-outside-ci' -H 'content-type: application/json' --data '{"event_id":"ci-trade-1","venue":"ci","symbol":"BTCUSDT","event_type":"trade","ts_ms":${TRADE_TS},"sequence":2,"price":100.01,"size":1,"side":"buy"}' >/tmp/trade.json
          jq -e '.status == "accepted" and .decision.strategy_version == "edge-map-ci-smoke-v2"' /tmp/trade.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/events -H 'authorization: Bearer ci-ingest-token-rotate-outside-ci' -H 'content-type: application/json' --data '{"event_id":"ci-trade-1","venue":"ci","symbol":"BTCUSDT","event_type":"trade","ts_ms":1792860000100,"sequence":2,"price":100.01,"size":1,"side":"buy"}' >/tmp/duplicate.json
          jq -e '.status == "duplicate_ignored"' /tmp/duplicate.json
          HTTP_STATUS=$(curl --silent --output /tmp/out-of-order.json --write-out '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/events -H 'authorization: Bearer ci-ingest-token-rotate-outside-ci' -H 'content-type: application/json' --data '{"event_id":"ci-old-1","venue":"ci","symbol":"BTCUSDT","event_type":"trade","ts_ms":${OLD_TS},"sequence":3,"price":100.00,"size":1,"side":"sell"}')
          test "$HTTP_STATUS" = "409"
