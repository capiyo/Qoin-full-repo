name: Qoin React Native typecheck

on:
  push:
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/react-mobile.yml"
  pull_request:
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/react-mobile.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck React Native app
        run: pnpm --filter @qoin/mobile exec tsc --noEmit
