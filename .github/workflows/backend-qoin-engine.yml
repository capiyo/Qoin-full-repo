name: Qoin engine checks
on:
  push:
    branches: [main, organized-monorepo, qoin-hardening, feat/mongodb-edge-strategy-map, qoin-engine-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Validate event schema JSON
        run: python -c "import json; json.load(open('contracts/market-event.schema.json'))"

  rust-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --workspace
