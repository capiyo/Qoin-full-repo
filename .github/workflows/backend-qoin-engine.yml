name: Qoin engine checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, organized-monorepo, hardening/research-safety-gates, feat/mongodb-edge-strategy-map, qoin-engine-integration]
  pull_request:
    branches: [main, organized-monorepo]
  workflow_dispatch:

jobs:
  python-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Validate event schema JSON
        run: python -c "import json; json.load(open('contracts/market-event.schema.json'))"

  rust-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run Rust tests
        run: cargo test --workspace --all-features --manifest-path backend/Cargo.toml
