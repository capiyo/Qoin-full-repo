name: Firebase rules

on:
  push:
    branches:
      - main
      - qoin-archive-explore-vector-ui
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/firebase-security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/firebase-security.yml"
  workflow_dispatch:

jobs:
  firestore:
    name: Firestore owner and field rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated emulator dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qoin-firebase"
          npm install --prefix "$RUNNER_TEMP/qoin-firebase" --no-save firebase@11.0.2 @firebase/rules-unit-testing@4.0.1 firebase-tools@13.31.2
          ln -s "$RUNNER_TEMP/qoin-firebase/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Run Firestore rules tests
        shell: bash
        run: |
          "$RUNNER_TEMP/qoin-firebase/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-qoin-firestore-rules "node firebase/firestore.rules.test.mjs"
