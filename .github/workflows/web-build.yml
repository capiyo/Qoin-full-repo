name: Qoin web build

on:
  push:
    branches: [main, feat/funspot-inspired-archive-feed-portfolio-ui]
    paths:
      - "frontend/apps/web/**"
      - "frontend/packages/core/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/apps/web/**"
      - "frontend/packages/core/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type-check and build web app
        run: pnpm --filter @qoin/react-web build
