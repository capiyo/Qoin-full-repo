openapi: 3.0.3
info:
  title: Qoin Market Flow API
  version: 0.1.0
  description: Research-only event/state/vector API. No order submission endpoint is registered.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health of gateway and Axum/MongoDB connection
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /v1/portfolio:
    get:
      summary: Read the authenticated user's instrument basket
      security: [{ FirebaseBearer: [] }]
      responses:
        '200':
          description: User portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '401': { description: Missing or invalid Firebase ID token }
        '503': { description: Authentication or portfolio storage unavailable }
    put:
      summary: Replace the authenticated user's instrument basket
      security: [{ FirebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols:
                  type: array
                  maxItems: 500
                  items: { type: string, maxLength: 32 }
      responses:
        '200': { description: Portfolio saved }
        '400': { description: Invalid instrument symbols }
        '401': { description: Missing or invalid Firebase ID token }
        '503': { description: Portfolio storage unavailable }
  /v1/investment-plan:
    get:
      summary: Read the authenticated user's own investment intention
      security: [{ FirebaseBearer: [] }]
      responses:
        '200':
          description: Saved plan, or null when the user has not created one
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/InvestmentPlan'
                nullable: true
        '401': { description: Missing or invalid Firebase ID token }
        '503': { description: Authentication or investment-plan storage unavailable }
    put:
      summary: Save the authenticated user's own investment intention
      security: [{ FirebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestmentPlanInput' }
      responses:
        '200':
          description: Investment intention saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestmentPlan' }
        '400': { description: Invalid goal, currency, contribution, target or horizon }
        '401': { description: Missing or invalid Firebase ID token }
        '503': { description: Investment-plan storage unavailable }
  /api/v1/events:
    post:
      summary: Ingest one market event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketEvent'
      responses:
        '200': { description: Event accepted or duplicate ignored }
        '400': { description: Invalid event }
        '503': { description: Persistence failure }
  /api/v1/state:
    get:
      summary: Get latest state estimate for a symbol
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest state }
        '503': { description: Storage unavailable }
  /api/v1/vector:
    get:
      summary: Get latest geometric vector decision
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest decision or abstain response }
        '503': { description: Storage unavailable }
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MarketEvent:
      type: object
      required: [event_id, venue, symbol, event_type, ts_ms]
      properties:
        event_id: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        event_type: { type: string, enum: [trade, book, funding, open_interest, liquidation] }
        ts_ms: { type: integer, minimum: 1 }
        price: { type: number, nullable: true, minimum: 0 }
        size: { type: number, nullable: true, minimum: 0 }
        side: { type: string, nullable: true, enum: [buy, sell, unknown] }
        bid: { type: number, nullable: true, minimum: 0 }
        ask: { type: number, nullable: true, minimum: 0 }
        bid_size: { type: number, nullable: true, minimum: 0 }
        ask_size: { type: number, nullable: true, minimum: 0 }
        funding_rate: { type: number, nullable: true }
        open_interest: { type: number, nullable: true, minimum: 0 }
        liquidation_side: { type: string, nullable: true, enum: [long, short] }

    Portfolio:
      type: object
      required: [symbols, updated_at]
      properties:
        symbols:
          type: array
          maxItems: 500
          items: { type: string }
        updated_at: { type: string, nullable: true }
    InvestmentPlanInput:
      type: object
      required: [goal, currency, monthly_contribution_minor, horizon_months]
      properties:
        goal: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, enum: [KES, USD, EUR, GBP] }
        monthly_contribution_minor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        target_amount_minor: { type: integer, format: int64, nullable: true, minimum: 1, maximum: 10000000000000 }
        horizon_months: { type: integer, minimum: 1, maximum: 600 }
    InvestmentPlan:
      allOf:
        - $ref: '#/components/schemas/InvestmentPlanInput'
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, nullable: true }
