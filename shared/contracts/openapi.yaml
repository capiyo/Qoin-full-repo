openapi: 3.0.3
info:
  title: Qoin Market Flow API
  version: 0.1.0
  description: Research-only event/state/vector API. No order submission endpoint is registered.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health of gateway and Axum/MongoDB connection
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /api/v1/events:
    get:
      summary: Get chronological raw market observations for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200': { description: Raw persisted events }
        '503': { description: Storage unavailable }
    # Writes are restricted to the loopback Axum ingestion endpoint; not part of the public gateway contract.
  /api/v1/state:
    get:
      summary: Get latest state estimate for a symbol
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest state }
        '503': { description: Storage unavailable }
  /api/v1/backtest:
    get:
      summary: Replay persisted raw market events through the pinned active research strategy
      description: |
        Deterministic read-only paper simulation. Uses only events already stored in MongoDB,
        sorts by event timestamp then event ID, and never submits orders. A signal can only fill
        on a strictly later timestamped executable trade or book observation; same-timestamp
        events cannot fill it. Book buys execute at ask and sells at bid. Each replay order has a
        stable replay-scoped ID and pending/filled status, with decision, submission, and fill
        timestamps plus source event IDs. Submission is assumed immediate at decision time;
        routing latency is not modeled. A final signal without a later eligible observation is
        returned as unfilled_pending_order. Returns fees, slippage, recorded funding cashflows,
        raw-event gap diagnostics, fills, drawdown, exact strategy version and assumptions. This
        is not a historical data download or a guarantee of complete market coverage. Results
        also include 1.0x baseline, 1.5x moderate, and 2.0x severe cost-only stress estimates;
        these reprice realized fees, slippage and impact without recomputing fills or liquidity.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: venue
          description: Optional provider venue; required when the symbol has mixed-venue history.
          schema: { type: string }
        - in: query
          name: from_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: to_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
        - in: query
          name: initial_capital
          schema: { type: number, exclusiveMinimum: 0, default: 10000 }
        - in: query
          name: fee_bps
          schema: { type: number, minimum: 0, default: 10 }
        - in: query
          name: slippage_bps
          description: Must be below 10000 basis points.
          schema: { type: number, minimum: 0, exclusiveMaximum: 10000, default: 5 }
        - in: query
          name: latency_ms
          description: Minimum delay from order submission to an eligible fill; 0 still requires a strictly later event.
          schema: { type: integer, minimum: 0, maximum: 60000, default: 0 }
        - in: query
          name: max_participation_rate
          description: Maximum fraction of observed trade size or side-specific top-of-book size that one fill may consume.
          schema: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.1 }
        - in: query
          name: market_impact_bps
          description: Maximum impact coefficient; each fill applies coefficient times squared participation ratio. Combined with slippage it must remain below 10000 bps.
          schema: { type: number, minimum: 0, maximum: 1000, default: 5 }
      responses:
        '200': { description: Replay metrics, fills, and assumptions }
        '413': { description: Replay event limit reached }
        '400': { description: Invalid replay parameters }
        '422': { description: Empty, invalid, or mixed-venue replay window }
        '503': { description: Historical event storage unavailable }
  /api/v1/vector/history:
    get:
      summary: Get chronological persisted vector decisions for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        '200': { description: Chronological decision-vector trajectory }
        '503': { description: Storage unavailable }
  /api/v1/set-ledger:
    get:
      summary: Derive Version 2 finite event sets and temporal relations for a symbol
      description: |
        Read-only research projection over persisted raw events. Returns set memberships,
        counting and observed trade-size measures, and temporal-precedence edges over a
        fixed 60-second window. Temporal ordering is not causation. Immutable observation
        and relation records are stored separately in MongoDB; historical coverage is
        operator-driven through the authenticated resumable backfill operation. V1 is unchanged.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200': { description: Derived set memberships and temporal relation ledger }
        '400': { description: Invalid symbol }
        '503': { description: Event storage unavailable }
  /api/v1/set-ledger/reconstruct:
    get:
      summary: Reconstruct Version 2 sets from durable observation records
      description: |
        Read-only reconstruction from MongoDB observation records. Recomputes source-event hashes
        and reports observation coverage, invalid records, truncation and durable relation counts.
        It does not repair records or grant decision or execution authority.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200': { description: Reconstructed finite sets and coverage diagnostics }
        '400': { description: Invalid symbol }
        '503': { description: Durable observation storage unavailable }
  /api/v1/set-ledger/backfill:
    post:
      summary: Backfill immutable V2 ledger records from historical raw events
      description: |
        Operator-only, bounded and resumable migration. Requires the dedicated ledger-maintenance secret
        in x-qoin-ledger-maintenance-token. Repeat with next_cursor fields until has_more
        is false. Deterministic record IDs make retries idempotent. Does not change V1.
      parameters:
        - in: header
          name: x-qoin-ledger-maintenance-token
          required: true
          schema: { type: string }
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: batch_size
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
        - in: query
          name: after_ts_ms
          schema: { type: integer }
        - in: query
          name: after_event_id
          schema: { type: string }
        - in: query
          name: after_venue
          schema: { type: string }
      responses:
        '200': { description: Backfill progress, counts and next cursor }
        '400': { description: Invalid symbol or cursor }
        '401': { description: Missing or invalid operator token }
        '503': { description: Source or ledger storage unavailable }
  /api/v1/set-ledger/integrity:
    get:
      summary: Audit V2 observation hashes and relation endpoints
      description: |
        Operator-only bounded audit. Recomputes source-event SHA-256 hashes, checks
        observation coverage and verifies that relation endpoints resolve to observation
        records. integrity_passed is true only when both scans are complete and clean.
      parameters:
        - in: header
          name: x-qoin-ledger-maintenance-token
          required: true
          schema: { type: string }
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        '200': { description: Bounded source and relation integrity report }
        '400': { description: Invalid symbol }
        '401': { description: Missing or invalid operator token }
        '503': { description: Storage unavailable }
  /api/v1/instruments:
    get:
      summary: Get the supported multi-asset instrument registry
      description: Each instrument exposes a display venue and canonical venue_id; use venue_id when filtering persisted market events or running historical replay.
      responses:
        '200': { description: Crypto, equities, FX, indices and commodities catalog with provider status }
  /api/v1/news:
    get:
      summary: Get sourced news from the configured Finnhub provider
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [general, forex, crypto, merger], default: general }
      responses:
        '200': { description: Sourced news items with publication time and attribution }
        '503': { description: Finnhub provider is not configured }
        '502': { description: Provider unavailable }
  /api/v1/calendar:
    get:
      summary: Get sourced upcoming economic-calendar events
      responses:
        '200': { description: Provider-attributed macro releases }
        '503': { description: Finnhub is not configured }
        '502': { description: Provider unavailable }
  /api/v1/stream:
    get:
      summary: WebSocket market updates and research vectors
      description: |
        WebSocket endpoint. Connect with ?symbols=BTCUSDT,ETHUSDT. Server sends
        stream.ready, market.update, stream.gap and stream.subscribed messages.
        Clients must refresh REST snapshots after stream.gap. Read-only; no order route.
      responses:
        '101': { description: WebSocket upgrade }
  /api/v1/vector:
    get:
      summary: Get latest geometric vector decision
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest decision or abstain response }
        '503': { description: Storage unavailable }
  /api/v1/operating-cycle:
    get:
      summary: Read the authenticated user's operating-cycle state
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cycle configuration and current phase }
        '401': { description: Firebase identity required }
        '503': { description: Identity or persistence unavailable }
    put:
      summary: Configure the authenticated user's research/paper operating cycle
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatingCycleConfig' }
      responses:
        '200': { description: Configuration persisted }
        '400': { description: Invalid cycle or paper-account configuration }
        '401': { description: Firebase identity required }
  /api/v1/operating-cycle/start:
    post:
      summary: Start the authenticated user's configured cycle
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cycle started }
        '400': { description: Paper accounts are required in paper mode }
        '409': { description: Cycle already active }
        '401': { description: Firebase identity required }
  /api/v1/operating-cycle/stop:
    post:
      summary: Stop the authenticated user's cycle and archive its paper session
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cycle stopped and paper ledger archived }
        '401': { description: Firebase identity required }
  /api/v1/paper-session:
    get:
      summary: Read the authenticated user's current paper-session ledger
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Per-account paper balances, positions and metrics }
        '401': { description: Firebase identity required }
  /api/v1/paper-session/history:
    get:
      summary: Read the authenticated user's paper Mirror decisions and closed trades
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: symbol, schema: { type: string } }
        - { in: query, name: cycle_id, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Paper decisions and trades }
        '401': { description: Firebase identity required }
  /api/v1/multi-horizon:
    post:
      summary: Evaluate up to eight independent causal horizon observations
      description: Research-only server-side vector evaluation. The result is descriptive and is never an order or allocation instruction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 8
              items: { $ref: '#/components/schemas/HorizonInput' }
      responses:
        '200':
          description: Independently evaluated horizon signals and descriptive consensus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MultiHorizonSignal' }
        '400': { description: Invalid or duplicate horizon input }
  /api/v1/market-horizons:
    get:
      summary: Evaluate causal multi-horizon research for one exact venue and symbol
      parameters:
        - { in: query, name: symbol, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { in: query, name: venue_id, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { in: query, name: min_events, required: false, schema: { type: integer, minimum: 5, maximum: 10000, default: 20 } }
      responses:
        '200':
          description: Research-only observations and descriptive horizon consensus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketHorizonsResponse' }
        '400': { description: Invalid symbol, venue or minimum event threshold }
        '503': { description: Market event storage unavailable }
  /api/v1/investment-plan:
    get:
      summary: Read the authenticated user's investment intention
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Saved intention or null when not configured }
        '401': { description: Firebase identity required }
    put:
      summary: Save the authenticated user's investment intention
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestmentPlanInput' }
      responses:
        '200': { description: Investment intention saved }
        '400': { description: Invalid goal, currency, contribution or horizon }
        '401': { description: Firebase identity required }
  /api/v1/paper-session/runs:
    get:
      summary: List the authenticated user's archived paper-session runs
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Archived paper sessions }
        '401': { description: Firebase identity required }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    OperatingCycleConfig:
      type: object
      required: [observation_minutes, weight_evaluation_minutes, session_minutes, mode, paper_accounts]
      properties:
        observation_minutes: { type: integer, minimum: 1, maximum: 120 }
        weight_evaluation_minutes: { type: integer, minimum: 1, maximum: 720 }
        session_minutes: { type: integer, minimum: 1, maximum: 1440 }
        mode: { type: string, enum: [research, paper] }
        paper_accounts:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PaperAccountConfig' }
    PaperAccountConfig:
      type: object
      required: [symbol, venue, quote_currency, initial_cash, notional_per_trade, contract_multiplier, quantity_step, reinvest_profits, fee_bps, slippage_bps]
      properties:
        symbol: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        quote_currency: { type: string, minLength: 1 }
        initial_cash: { type: number, minimum: 0, exclusiveMinimum: true }
        notional_per_trade: { type: number, minimum: 0, exclusiveMinimum: true }
        contract_multiplier: { type: number, minimum: 0, exclusiveMinimum: true }
        quantity_step: { type: number, minimum: 0, exclusiveMinimum: true }
        reinvest_profits: { type: boolean }
        fee_bps: { type: number, minimum: 0, maximum: 100 }
        slippage_bps: { type: number, minimum: 0, maximum: 100 }
    MarketForceObservation:
      type: object
      required: [ofi, liquidity, volatility, funding, open_interest_change, liquidation_pressure, basis]
      properties:
        ofi: { type: number }
        liquidity: { type: number }
        volatility: { type: number }
        funding: { type: number }
        open_interest_change: { type: number }
        liquidation_pressure: { type: number }
        basis: { type: number }
        spread_bps: { type: number, nullable: true }
        spread_age_ms: { type: integer, nullable: true }
    EngineConfig:
      type: object
      required: [signal_threshold, input_clip, score_clip, top_k, min_alignment, max_angle_radians, volatility_dampener, interaction_coefficient, max_spread_bps, max_spread_age_ms]
      properties:
        signal_threshold: { type: number }
        input_clip: { type: number }
        score_clip: { type: number }
        top_k: { type: integer }
        min_alignment: { type: number }
        max_angle_radians: { type: number }
        volatility_dampener: { type: number }
        interaction_coefficient: { type: number }
        max_spread_bps: { type: number }
        max_spread_age_ms: { type: integer }
    HorizonInput:
      type: object
      required: [horizon, observation, config, strategy_version, has_open_position]
      properties:
        horizon: { type: string, enum: [one_minute, five_minutes, fifteen_minutes, thirty_minutes, one_hour, four_hours, one_day, one_week] }
        observation: { $ref: '#/components/schemas/MarketForceObservation' }
        config: { $ref: '#/components/schemas/EngineConfig' }
        strategy_version: { type: string, minLength: 1 }
        has_open_position: { type: boolean }
    HorizonSignal:
      type: object
      required: [horizon, duration_seconds, signal]
      properties:
        horizon: { type: string }
        duration_seconds: { type: integer, format: int64 }
        signal:
          type: object
          required: [decision, action, score, alignment, rationale, strategy_version, config_fingerprint, reject_reason]
          properties:
            decision: { type: string }
            action: { type: string }
            score: { type: number }
            alignment: { type: number }
            rationale: { type: string }
            strategy_version: { type: string }
            config_fingerprint: { type: string, pattern: '^[0-9a-f]{16}
    HorizonConsensus:
      type: object
      required: [relationship, buy_count, sell_count, wait_count, close_count, directional_count, unanimous_direction]
      properties:
        relationship: { type: string, enum: [aligned_buy, aligned_sell, divergent, no_directional_consensus] }
        buy_count: { type: integer }
        sell_count: { type: integer }
        wait_count: { type: integer }
        close_count: { type: integer }
        directional_count: { type: integer }
        unanimous_direction: { type: string, nullable: true }
    MultiHorizonSignal:
      type: object
      required: [horizons, consensus]
      properties:
        horizons: { type: array, items: { $ref: '#/components/schemas/HorizonSignal' } }
        consensus: { $ref: '#/components/schemas/HorizonConsensus' }
    MarketHorizonsResponse:
      type: object
      required: [symbol, venue_id, decision_ts_ms, events_loaded, event_documents, invalid_event_documents, event_limit_reached, mode, observations, signals, note]
      properties:
        symbol: { type: string }
        venue_id: { type: string }
        decision_ts_ms: { type: integer, format: int64 }
        events_loaded: { type: integer, minimum: 0 }
        event_documents: { type: integer, minimum: 0 }
        invalid_event_documents: { type: integer, minimum: 0 }
        event_limit_reached: { type: boolean }
        mode: { type: string, enum: [research_only] }
        observations:
          type: array
          items: { $ref: '#/components/schemas/HorizonObservation' }
        signals:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/MultiHorizonSignal' }
          description: Descriptive consensus and independently evaluated horizon signals; never an order.
        note: { type: string }
    HorizonObservation:
      type: object
      required: [horizon, observation, event_count, trade_count, book_count, data_quality, coverage_ratio, ready, reasons]
      properties:
        horizon: { type: string, enum: [one_minute, five_minutes, fifteen_minutes, thirty_minutes, one_hour, four_hours, one_day, one_week] }
        observation: { $ref: '#/components/schemas/MarketForceObservation' }
        event_count: { type: integer }
        trade_count: { type: integer }
        book_count: { type: integer }
        first_event_ts_ms: { type: integer, nullable: true, format: int64 }
        last_event_ts_ms: { type: integer, nullable: true, format: int64 }
        data_quality: { type: number, minimum: 0, maximum: 1 }
        coverage_ratio: { type: number, minimum: 0, maximum: 1 }
        ready: { type: boolean }
        reasons: { type: array, items: { type: string } }
    InvestmentPlanInput:
      type: object
      required: [goal, currency, monthly_contribution_minor, target_amount_minor, horizon_months]
      properties:
        goal: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, enum: [KES, USD, EUR, GBP] }
        monthly_contribution_minor: { type: integer, minimum: 1, maximum: 100000000000 }
        target_amount_minor: { type: integer, nullable: true, minimum: 1, maximum: 10000000000000 }
        horizon_months: { type: integer, minimum: 1, maximum: 600 }
    InvestmentPlan:
      allOf:
        - { $ref: '#/components/schemas/InvestmentPlanInput' }
        - type: object
          properties:
            updated_at: { type: string, nullable: true, format: date-time }
    MarketEvent:
      type: object
      required: [event_id, venue, symbol, event_type, ts_ms]
      properties:
        event_id: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        event_type: { type: string, enum: [trade, book, funding, open_interest, liquidation] }
        ts_ms: { type: integer, minimum: 1 }
        price: { type: number, nullable: true, minimum: 0 }
        size: { type: number, nullable: true, minimum: 0 }
        side: { type: string, nullable: true, enum: [buy, sell, unknown] }
        bid: { type: number, nullable: true, minimum: 0 }
        ask: { type: number, nullable: true, minimum: 0 }
        bid_size: { type: number, nullable: true, minimum: 0 }
        ask_size: { type: number, nullable: true, minimum: 0 }
        funding_rate: { type: number, nullable: true }
        open_interest: { type: number, nullable: true, minimum: 0 }
        liquidation_side: { type: string, nullable: true, enum: [long, short] }

 }
            reject_reason: { type: string, nullable: true, enum: [SPREAD_MISSING_OR_WIDE, SPREAD_STALE, LOW_MAGNITUDE, MISALIGNED, BOTH, FLAT_VECTOR] }
    HorizonConsensus:
      type: object
      required: [relationship, buy_count, sell_count, wait_count, close_count, directional_count, unanimous_direction]
      properties:
        relationship: { type: string, enum: [aligned_buy, aligned_sell, divergent, no_directional_consensus] }
        buy_count: { type: integer }
        sell_count: { type: integer }
        wait_count: { type: integer }
        close_count: { type: integer }
        directional_count: { type: integer }
        unanimous_direction: { type: string, nullable: true }
    MultiHorizonSignal:
      type: object
      required: [horizons, consensus]
      properties:
        horizons: { type: array, items: { $ref: '#/components/schemas/HorizonSignal' } }
        consensus: { $ref: '#/components/schemas/HorizonConsensus' }
    MarketHorizonsResponse:
      type: object
      required: [symbol, venue_id, decision_ts_ms, events_loaded, event_documents, invalid_event_documents, event_limit_reached, mode, observations, signals, note]
      properties:
        symbol: { type: string }
        venue_id: { type: string }
        decision_ts_ms: { type: integer, format: int64 }
        events_loaded: { type: integer, minimum: 0 }
        event_documents: { type: integer, minimum: 0 }
        invalid_event_documents: { type: integer, minimum: 0 }
        event_limit_reached: { type: boolean }
        mode: { type: string, enum: [research_only] }
        observations:
          type: array
          items: { $ref: '#/components/schemas/HorizonObservation' }
        signals:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/MultiHorizonSignal' }
          description: Descriptive consensus and independently evaluated horizon signals; never an order.
        note: { type: string }
    HorizonObservation:
      type: object
      required: [horizon, observation, event_count, trade_count, book_count, data_quality, coverage_ratio, ready, reasons]
      properties:
        horizon: { type: string, enum: [one_minute, five_minutes, fifteen_minutes, thirty_minutes, one_hour, four_hours, one_day, one_week] }
        observation: { $ref: '#/components/schemas/MarketForceObservation' }
        event_count: { type: integer }
        trade_count: { type: integer }
        book_count: { type: integer }
        first_event_ts_ms: { type: integer, nullable: true, format: int64 }
        last_event_ts_ms: { type: integer, nullable: true, format: int64 }
        data_quality: { type: number, minimum: 0, maximum: 1 }
        coverage_ratio: { type: number, minimum: 0, maximum: 1 }
        ready: { type: boolean }
        reasons: { type: array, items: { type: string } }
    InvestmentPlanInput:
      type: object
      required: [goal, currency, monthly_contribution_minor, target_amount_minor, horizon_months]
      properties:
        goal: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, enum: [KES, USD, EUR, GBP] }
        monthly_contribution_minor: { type: integer, minimum: 1, maximum: 100000000000 }
        target_amount_minor: { type: integer, nullable: true, minimum: 1, maximum: 10000000000000 }
        horizon_months: { type: integer, minimum: 1, maximum: 600 }
    InvestmentPlan:
      allOf:
        - { $ref: '#/components/schemas/InvestmentPlanInput' }
        - type: object
          properties:
            updated_at: { type: string, nullable: true, format: date-time }
    MarketEvent:
      type: object
      required: [event_id, venue, symbol, event_type, ts_ms]
      properties:
        event_id: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        event_type: { type: string, enum: [trade, book, funding, open_interest, liquidation] }
        ts_ms: { type: integer, minimum: 1 }
        price: { type: number, nullable: true, minimum: 0 }
        size: { type: number, nullable: true, minimum: 0 }
        side: { type: string, nullable: true, enum: [buy, sell, unknown] }
        bid: { type: number, nullable: true, minimum: 0 }
        ask: { type: number, nullable: true, minimum: 0 }
        bid_size: { type: number, nullable: true, minimum: 0 }
        ask_size: { type: number, nullable: true, minimum: 0 }
        funding_rate: { type: number, nullable: true }
        open_interest: { type: number, nullable: true, minimum: 0 }
        liquidation_side: { type: string, nullable: true, enum: [long, short] }

