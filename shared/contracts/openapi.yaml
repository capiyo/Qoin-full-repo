openapi: 3.0.3
info:
  title: Qoin Market Flow API
  version: 0.1.0
  description: Research-only event/state/vector API. No order submission endpoint is registered.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health of gateway and Axum/MongoDB connection
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /api/v1/events:
    get:
      summary: Get chronological raw market observations for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200': { description: Raw persisted events }
        '503': { description: Storage unavailable }
    post:
      summary: Ingest one market event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketEvent'
      responses:
        '200': { description: Event accepted or duplicate ignored }
        '400': { description: Invalid event }
        '503': { description: Persistence failure }
  /api/v1/state:
    get:
      summary: Get latest state estimate for a symbol
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest state }
        '503': { description: Storage unavailable }
  /api/v1/backtest:
    get:
      summary: Replay persisted raw market events through the pinned active research strategy
      description: |
        Deterministic read-only paper simulation. Uses only events already stored in MongoDB,
        sorts by event timestamp then event ID, and never submits orders. Returns fees,
        slippage, recorded funding cashflows, raw-event gap diagnostics, fills, drawdown, exact
        strategy version and simulation assumptions.
        This endpoint is not a historical market-data download or a guarantee of complete coverage.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: venue
          description: Optional provider venue; required when the symbol has mixed-venue history.
          schema: { type: string }
        - in: query
          name: from_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: to_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
        - in: query
          name: initial_capital
          schema: { type: number, exclusiveMinimum: 0, default: 10000 }
        - in: query
          name: fee_bps
          schema: { type: number, minimum: 0, default: 10 }
        - in: query
          name: slippage_bps
          description: Must be below 10000 basis points.
          schema: { type: number, minimum: 0, exclusiveMaximum: 10000, default: 5 }
      responses:
        '200': { description: Replay metrics, fills, and assumptions }
        '413': { description: Replay event limit reached }
        '400': { description: Invalid replay parameters }
        '422': { description: Empty, invalid, or mixed-venue replay window }
        '503': { description: Historical event storage unavailable }
  /api/v1/vector/history:
    get:
      summary: Get chronological persisted vector decisions for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        '200': { description: Chronological decision-vector trajectory }
        '503': { description: Storage unavailable }
  /api/v1/instruments:
    get:
      summary: Get the supported multi-asset instrument registry
      description: Each instrument exposes a display venue and canonical venue_id; use venue_id when filtering persisted market events or running historical replay.
      responses:
        '200': { description: Crypto, equities, FX, indices and commodities catalog with provider status }
  /api/v1/news:
    get:
      summary: Get sourced news from the configured Finnhub provider
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [general, forex, crypto, merger], default: general }
      responses:
        '200': { description: Sourced news items with publication time and attribution }
        '503': { description: Finnhub provider is not configured }
        '502': { description: Provider unavailable }
  /api/v1/calendar:
    get:
      summary: Get sourced upcoming economic-calendar events
      responses:
        '200': { description: Provider-attributed macro releases }
        '503': { description: Finnhub is not configured }
        '502': { description: Provider unavailable }
  /api/v1/stream:
    get:
      summary: WebSocket market updates and research vectors
      description: |
        WebSocket endpoint. Connect with ?symbols=BTCUSDT,ETHUSDT. Server sends
        stream.ready, market.update, stream.gap and stream.subscribed messages.
        Clients must refresh REST snapshots after stream.gap. Read-only; no order route.
      responses:
        '101': { description: WebSocket upgrade }
  /api/v1/vector:
    get:
      summary: Get latest geometric vector decision
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest decision or abstain response }
        '503': { description: Storage unavailable }
components:
  schemas:
    MarketEvent:
      type: object
      required: [event_id, venue, symbol, event_type, ts_ms]
      properties:
        event_id: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        event_type: { type: string, enum: [trade, book, funding, open_interest, liquidation] }
        ts_ms: { type: integer, minimum: 1 }
        price: { type: number, nullable: true, minimum: 0 }
        size: { type: number, nullable: true, minimum: 0 }
        side: { type: string, nullable: true, enum: [buy, sell, unknown] }
        bid: { type: number, nullable: true, minimum: 0 }
        ask: { type: number, nullable: true, minimum: 0 }
        bid_size: { type: number, nullable: true, minimum: 0 }
        ask_size: { type: number, nullable: true, minimum: 0 }
        funding_rate: { type: number, nullable: true }
        open_interest: { type: number, nullable: true, minimum: 0 }
        liquidation_side: { type: string, nullable: true, enum: [long, short] }
