openapi: 3.0.3
info:
  title: Qoin Market Flow API
  version: 0.1.0
  description: Research-only event/state/vector API. No order submission endpoint is registered.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/signal:
    post:
      summary: Evaluate one normalized observation with the authoritative Rust vector engine
      description: |
        Research signal only. It never authorizes or submits an order. Pulse, Attend and
        pressure-blade fields expose the existing V1 math; they do not alter the decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignalRequest' }
      responses:
        '200': { description: Versioned Rust signal and complete Attend/Pulse contribution trace, content: { application/json: { schema: { $ref: '#/components/schemas/Signal' } } } }
        '400': { description: Invalid or non-finite observation }
        '413': { description: Request body exceeds the one MiB Axum limit }
        '429': { description: Gateway rate limit exceeded }
  /health:
    get:
      summary: Health of gateway and Axum/MongoDB connection
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /api/v1/events:
    get:
      summary: Get chronological raw market observations for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200': { description: Raw persisted events }
        '503': { description: Storage unavailable }
    # Writes are restricted to the loopback Axum ingestion endpoint; not part of the public gateway contract.
  /api/v1/state:
    get:
      summary: Get latest state estimate for a symbol
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest state }
        '503': { description: Storage unavailable }
  /api/v1/backtest:
    get:
      summary: Replay persisted raw market events through the pinned active research strategy
      description: |
        Deterministic read-only paper simulation. Uses only events already stored in MongoDB,
        sorts by event timestamp then event ID, and never submits orders. A signal can only fill
        on a strictly later timestamped executable trade or book observation; same-timestamp
        events cannot fill it. Book buys execute at ask and sells at bid. Each replay order has a
        stable replay-scoped ID and pending/filled status, with decision, submission, and fill
        timestamps plus source event IDs. Submission is assumed immediate at decision time;
        routing latency is not modeled. A final signal without a later eligible observation is
        returned as unfilled_pending_order. Returns fees, slippage, recorded funding cashflows,
        raw-event gap diagnostics, fills, drawdown, exact strategy version and assumptions. This
        is not a historical data download or a guarantee of complete market coverage. Results
        also include 1.0x baseline, 1.5x moderate, and 2.0x severe cost-only stress estimates;
        these reprice realized fees, slippage and impact without recomputing fills or liquidity.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: venue
          description: Optional provider venue; required when the symbol has mixed-venue history.
          schema: { type: string }
        - in: query
          name: from_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: to_ts_ms
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
        - in: query
          name: initial_capital
          schema: { type: number, exclusiveMinimum: 0, default: 10000 }
        - in: query
          name: fee_bps
          schema: { type: number, minimum: 0, default: 10 }
        - in: query
          name: slippage_bps
          description: Must be below 10000 basis points.
          schema: { type: number, minimum: 0, exclusiveMaximum: 10000, default: 5 }
        - in: query
          name: latency_ms
          description: Minimum delay from order submission to an eligible fill; 0 still requires a strictly later event.
          schema: { type: integer, minimum: 0, maximum: 60000, default: 0 }
        - in: query
          name: max_participation_rate
          description: Maximum fraction of observed trade size or side-specific top-of-book size that one fill may consume.
          schema: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.1 }
        - in: query
          name: market_impact_bps
          description: Maximum impact coefficient; each fill applies coefficient times squared participation ratio. Combined with slippage it must remain below 10000 bps.
          schema: { type: number, minimum: 0, maximum: 1000, default: 5 }
      responses:
        '200': { description: Replay metrics, fills, and assumptions }
        '413': { description: Replay event limit reached }
        '400': { description: Invalid replay parameters }
        '422': { description: Empty, invalid, or mixed-venue replay window }
        '503': { description: Historical event storage unavailable }
  /api/v1/vector/history:
    get:
      summary: Get chronological persisted vector decisions for a symbol
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        '200': { description: Chronological decision-vector trajectory }
        '503': { description: Storage unavailable }
  /api/v1/set-ledger:
    get:
      summary: Derive Version 2 finite event sets and temporal relations for a symbol
      description: |
        Read-only research projection over persisted raw events. Returns set memberships,
        counting and observed trade-size measures, and temporal-precedence edges over a
        fixed 60-second window. Temporal ordering is not causation. Immutable observation
        and relation records are stored separately in MongoDB; historical coverage is
        operator-driven through the authenticated resumable backfill operation. V1 is unchanged.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200': { description: Derived set memberships and temporal relation ledger }
        '400': { description: Invalid symbol }
        '503': { description: Event storage unavailable }
  /api/v1/set-ledger/reconstruct:
    get:
      summary: Reconstruct Version 2 sets from durable observation records
      description: |
        Read-only reconstruction from MongoDB observation records. Recomputes source-event hashes
        and reports observation coverage, invalid records, truncation and durable relation counts.
        It does not repair records or grant decision or execution authority.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200': { description: Reconstructed finite sets and coverage diagnostics }
        '400': { description: Invalid symbol }
        '503': { description: Durable observation storage unavailable }
  /api/v1/set-ledger/backfill:
    post:
      summary: Backfill immutable V2 ledger records from historical raw events
      description: |
        Operator-only, bounded and resumable migration. Requires the dedicated ledger-maintenance secret
        in x-qoin-ledger-maintenance-token. Repeat with next_cursor fields until has_more
        is false. Deterministic record IDs make retries idempotent. Does not change V1.
      parameters:
        - in: header
          name: x-qoin-ledger-maintenance-token
          required: true
          schema: { type: string }
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: batch_size
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
        - in: query
          name: after_ts_ms
          schema: { type: integer }
        - in: query
          name: after_event_id
          schema: { type: string }
        - in: query
          name: after_venue
          schema: { type: string }
      responses:
        '200': { description: Backfill progress, counts and next cursor }
        '400': { description: Invalid symbol or cursor }
        '401': { description: Missing or invalid operator token }
        '503': { description: Source or ledger storage unavailable }
  /api/v1/set-ledger/integrity:
    get:
      summary: Audit V2 observation hashes and relation endpoints
      description: |
        Operator-only bounded audit. Recomputes source-event SHA-256 hashes, checks
        observation coverage and verifies that relation endpoints resolve to observation
        records. integrity_passed is true only when both scans are complete and clean.
      parameters:
        - in: header
          name: x-qoin-ledger-maintenance-token
          required: true
          schema: { type: string }
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        '200': { description: Bounded source and relation integrity report }
        '400': { description: Invalid symbol }
        '401': { description: Missing or invalid operator token }
        '503': { description: Storage unavailable }
  /api/v1/instruments:
    get:
      summary: Get the supported multi-asset instrument registry
      description: Each instrument exposes a display venue and canonical venue_id; use venue_id when filtering persisted market events or running historical replay.
      responses:
        '200': { description: Crypto, equities, FX, indices and commodities catalog with provider status }
  /api/v1/news:
    get:
      summary: Get sourced news from the configured Finnhub provider
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [general, forex, crypto, merger], default: general }
      responses:
        '200': { description: Sourced news items with publication time and attribution }
        '503': { description: Finnhub provider is not configured }
        '502': { description: Provider unavailable }
  /api/v1/calendar:
    get:
      summary: Get sourced upcoming economic-calendar events
      responses:
        '200': { description: Provider-attributed macro releases }
        '503': { description: Finnhub is not configured }
        '502': { description: Provider unavailable }
  /api/v1/paper-session:
    get:
      summary: Read the authenticated user's paper portfolio snapshot
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owner-scoped paper account and position snapshot }
        '401': { description: Firebase authentication required }
  /api/v1/paper-session/start:
    post:
      summary: Start or replace the authenticated user's paper session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id, accounts]
              properties:
                cycle_id: { type: string, minLength: 1, maxLength: 128 }
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/PaperAccountConfig' }
      responses:
        '200': { description: Owner-scoped paper session started }
        '400': { description: Invalid session or account configuration }
        '401': { description: Firebase authentication required }
        '503': { description: Durable session persistence unavailable }
  /api/v1/paper-session/stop:
    post:
      summary: Stop the authenticated user's paper session
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owner-scoped paper session stopped }
        '401': { description: Firebase authentication required }
  /api/v1/paper-session/trades:
    get:
      summary: List the authenticated user's persisted paper trades
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cycle_id
          schema: { type: string, maxLength: 128 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Owner-scoped paper trade history }
        '400': { description: Invalid query }
        '401': { description: Firebase authentication required }
        '503': { description: Paper trade history unavailable }
  /api/v1/paper-session/decisions:
    get:
      summary: List the authenticated user's persisted paper decisions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cycle_id
          schema: { type: string, maxLength: 128 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Owner-scoped paper decision history }
        '400': { description: Invalid query }
        '401': { description: Firebase authentication required }
        '503': { description: Paper decision history unavailable }
  /api/v1/broker-connections:
    get:
      summary: List the authenticated user's broker connection metadata without credentials
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owner-scoped broker connection metadata; secret fields are omitted }
        '401': { description: Firebase authentication required }
    post:
      summary: Store a broker credential set encrypted at rest on the backend
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrokerConnection'
      responses:
        '201': { description: Connection created in pending_validation state; trading disabled }
        '400': { description: Invalid credential payload or broker identifier }
        '401': { description: Firebase authentication required }
        '503': { description: Credential vault not configured or persistence unavailable }
  /api/v1/broker-connections/rotate:
    post:
      summary: Rotate credentials for an owned broker connection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, credentials]
              properties:
                connection_id: { type: string }
                credentials: { $ref: '#/components/schemas/BrokerCredentialInput' }
      responses:
        '200': { description: Credentials replaced; connection returned to pending_validation }
        '401': { description: Firebase authentication required }
        '404': { description: Owned connection not found }
  /api/v1/broker-connections/revoke:
    post:
      summary: Revoke and erase the encrypted credentials for an owned broker connection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id]
              properties:
                connection_id: { type: string }
      responses:
        '200': { description: Connection revoked and credential envelope removed }
        '401': { description: Firebase authentication required }
        '404': { description: Owned connection not found }
  /api/v1/stream:
    get:
      summary: WebSocket market updates and research vectors
      description: |
        WebSocket endpoint. Connect with ?symbols=BTCUSDT,ETHUSDT. Server sends
        stream.ready, market.update, stream.gap and stream.subscribed messages.
        Clients must refresh REST snapshots after stream.gap. Read-only; no order route.
      responses:
        '101': { description: WebSocket upgrade }
  /api/v1/vector:
    get:
      summary: Get latest geometric vector decision
      parameters:
        - in: query
          name: symbol
          schema: { type: string, default: BTCUSDT }
      responses:
        '200': { description: Latest decision or abstain response }
        '503': { description: Storage unavailable }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    ForceObservation:
      type: object
      required: [ofi, liquidity, volatility, funding, open_interest_change, liquidation_pressure, basis]
      properties:
        ofi: { type: number }
        liquidity: { type: number }
        volatility: { type: number }
        funding: { type: number }
        open_interest_change: { type: number }
        liquidation_pressure: { type: number }
        basis: { type: number }
        spread_bps: { type: number, nullable: true, minimum: 0 }
        spread_age_ms: { type: integer, nullable: true, minimum: 0 }
    SignalRequest:
      type: object
      required: [observation, has_open_position]
      properties:
        observation: { $ref: '#/components/schemas/ForceObservation' }
        has_open_position: { type: boolean }
    FeatureTrace:
      type: object
      properties:
        name: { type: string }
        raw_value: { type: number }
        transform: { type: string }
        scale: { type: number }
        normalized_value: { type: number }
        clamped_value: { type: number }
        selected: { type: boolean }
        attended_value: { type: number }
        bullish_weight: { type: number }
        bearish_weight: { type: number }
        bullish_weighted_term: { type: number }
        bearish_weighted_term: { type: number }
        directional_weight: { type: number }
        directional_contribution: { type: number }
        interaction_contribution: { type: number }
        attend_weights: { type: array, items: { type: number }, minItems: 7, maxItems: 7 }
        pulse_bullish: { type: number, minimum: 0 }
        pulse_bearish: { type: number, minimum: 0 }
        pressure_blade_contribution: { type: number }
    Signal:
      type: object
      required: [decision, action, score, alignment, config_version, attend, attention, pulse, pressure_blade_total, feature_trace]
      properties:
        decision: { type: string, enum: [BUY, SELL, CLOSE, WAIT] }
        action: { type: string, enum: [buy, sell, close, wait] }
        score: { type: number }
        alignment: { type: number }
        angle_radians: { type: number }
        angle_degrees: { type: number }
        active_force_count: { type: integer }
        config_version: { type: string }
        rationale: { type: string }
        feature_names: { type: array, items: { type: string } }
        raw_inputs: { type: object, additionalProperties: { type: number } }
        features: { type: object, additionalProperties: { type: number } }
        attend:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: array, minItems: 7, maxItems: 7, items: { type: number } }
        attention:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: array, minItems: 7, maxItems: 7, items: { type: number } }
        attended_features: { type: array, items: { type: number }, minItems: 7, maxItems: 7 }
        pulse: { type: array, items: { type: number, minimum: 0 }, minItems: 2, maxItems: 2 }
        pressure_blade_total: { type: number }
        feature_trace: { type: array, items: { $ref: '#/components/schemas/FeatureTrace' }, minItems: 7, maxItems: 7 }
        decision_vector: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        magnitude: { type: number }
        interaction_contribution: { type: number }
        diagnostics: { type: object }
    PaperAccountConfig:
      type: object
      required: [symbol, venue, quote_currency, initial_cash, notional_per_trade]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 96 }
        venue: { type: string, minLength: 1, maxLength: 64 }
        quote_currency: { type: string, minLength: 1, maxLength: 16 }
        initial_cash: { type: number, exclusiveMinimum: 0 }
        notional_per_trade: { type: number, exclusiveMinimum: 0 }
        contract_multiplier: { type: number, exclusiveMinimum: 0, default: 1 }
        quantity_step: { type: number, exclusiveMinimum: 0, default: 0.000001 }
        reinvest_profits: { type: boolean, default: true }
        fee_bps: { type: number, minimum: 0, default: 10 }
        slippage_bps: { type: number, minimum: 0, maximum: 9999, default: 5 }
    BrokerCredentialInput:
      type: object
      properties:
        api_key: { type: string, maxLength: 4096 }
        api_secret: { type: string, maxLength: 8192 }
        api_token: { type: string, maxLength: 8192 }
        passphrase: { type: string, maxLength: 4096 }
    CreateBrokerConnection:
      type: object
      required: [broker_id, credentials]
      properties:
        broker_id: { type: string, minLength: 1, maxLength: 64 }
        account_id: { type: string, maxLength: 256 }
        label: { type: string, maxLength: 80 }
        credentials: { $ref: '#/components/schemas/BrokerCredentialInput' }
    MarketEvent:
      type: object
      required: [event_id, venue, symbol, event_type, ts_ms]
      properties:
        event_id: { type: string, minLength: 1 }
        venue: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        event_type: { type: string, enum: [trade, book, funding, open_interest, liquidation] }
        ts_ms: { type: integer, minimum: 1 }
        price: { type: number, nullable: true, minimum: 0 }
        size: { type: number, nullable: true, minimum: 0 }
        side: { type: string, nullable: true, enum: [buy, sell, unknown] }
        bid: { type: number, nullable: true, minimum: 0 }
        ask: { type: number, nullable: true, minimum: 0 }
        bid_size: { type: number, nullable: true, minimum: 0 }
        ask_size: { type: number, nullable: true, minimum: 0 }
        funding_rate: { type: number, nullable: true }
        open_interest: { type: number, nullable: true, minimum: 0 }
        liquidation_side: { type: string, nullable: true, enum: [long, short] }
