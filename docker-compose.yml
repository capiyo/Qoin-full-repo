services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set a unique MongoDB root username in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set a strong MongoDB root password in .env}
      QOIN_MONGODB_DATABASE: ${QOIN_MONGODB_DATABASE:-qoin}
      QOIN_MONGODB_APP_USERNAME: ${QOIN_MONGODB_APP_USERNAME:?Set a Qoin application username in .env}
      QOIN_MONGODB_APP_PASSWORD: ${QOIN_MONGODB_APP_PASSWORD:?Set a strong Qoin application password in .env}
    volumes:
      - qoin-mongodb-data:/data/db
      - ./docker/mongo-init/01-create-qoin-user.js:/docker-entrypoint-initdb.d/01-create-qoin-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [qoin-private]

  axum:
    build:
      context: .
      dockerfile: backend/rust-axum/Dockerfile
    restart: unless-stopped
    environment:
      QOIN_MONGODB_URI: mongodb://${QOIN_MONGODB_APP_USERNAME}:${QOIN_MONGODB_APP_PASSWORD}@mongodb:27017/${QOIN_MONGODB_DATABASE:-qoin}?authSource=${QOIN_MONGODB_DATABASE:-qoin}
      QOIN_MONGODB_DATABASE: ${QOIN_MONGODB_DATABASE:-qoin}
      QOIN_AXUM_ADDR: 0.0.0.0:8081
      QOIN_AXUM_INTERNAL_ADDR: 127.0.0.1:8081
      RUST_LOG: ${RUST_LOG:-info}
      QOIN_BINANCE_STREAM_ENABLED: ${QOIN_BINANCE_STREAM_ENABLED:-true}
      QOIN_BINANCE_STREAM_SYMBOLS: ${QOIN_BINANCE_STREAM_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      QOIN_JEPA_URL: ${QOIN_JEPA_URL:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [qoin-private]

  gateway:
    build:
      context: .
      dockerfile: backend/cpp-drogon/Dockerfile
    restart: unless-stopped
    environment:
      QOIN_AXUM_URL: http://axum:8081
      QOIN_AXUM_WS_URL: ws://axum:8081
      QOIN_DROGON_HOST: 0.0.0.0
      QOIN_DROGON_PORT: 8080
    depends_on:
      axum:
        condition: service_healthy
    ports:
      - "${QOIN_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [qoin-private]

networks:
  qoin-private:
    driver: bridge

volumes:
  qoin-mongodb-data:
